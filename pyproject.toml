[project]
name = "swla"
version = "0.1.0"
description = "Sliding window / global attention experiments"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Two packages: the model code (src/swla) and the experiment configs (configs/).
# Installing `configs` makes `import configs.ratio_5to1` work from any directory,
# e.g. when a script is started as `python scripts/train.py`.
[tool.setuptools]
packages = ["swla", "configs"]

[tool.setuptools.package-dir]
swla = "src/swla"
configs = "configs"
