# Conda environment for the sliding-window attention experiments (CPU only).
#
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Use:     conda activate swla
name: swla
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # CPU-only PyTorch build (no CUDA download)
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.14.0+cpu
      - numpy==2.4.6
      - psutil==7.2.2
      - matplotlib==3.11.2
      - pytest==9.1.1
      - ipykernel==7.3.0
      # the project itself, editable, so `import swla` works everywhere
      - -e .[dev]
